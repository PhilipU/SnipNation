name: Enable auto-merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_run:
    workflows: [Build and test]
    types: [completed]

permissions: {}

jobs:
  enable:
    name: Enable auto-merge for the pull request
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.id == github.event.repository.id
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable GitHub auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --auto --merge --match-head-commit "$PR_HEAD"

  refresh:
    name: Refresh screenshots after auto-merge
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Start CI for the merged source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The run's pull request list can be empty after merge or on a rerun.
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$PR_BRANCH" --state all \
            --json number,headRefOid,isCrossRepository,isDraft,state |
            jq -r --arg head "$PR_HEAD" 'first(.[] | select(
              .headRefOid == $head and .isCrossRepository == false and .isDraft == false and .state != "CLOSED"
            )) | .number')
          if [[ -z "$number" ]]; then
            exit 0
          fi

          # Merges performed with GITHUB_TOKEN can suppress the main push workflow.
          for attempt in {1..12}; do
            pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")
            if ! jq -e --arg sha "$PR_HEAD" --arg repo "$GITHUB_REPOSITORY" '
              .draft == false and .base.ref == "main" and
              .head.repo.full_name == $repo and .head.sha == $sha
            ' <<< "$pull" > /dev/null; then
              exit 0
            fi

            if [[ "$(jq -r '.merged' <<< "$pull")" == true ]]; then
              main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
              runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
                --commit "$main" --json databaseId --jq 'length')
              if [[ "$runs" == 0 ]]; then
                gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
              fi
              exit 0
            fi

            if [[ "$(jq -r '.state' <<< "$pull")" != open ]]; then
              exit 0
            fi
            sleep 5
          done
